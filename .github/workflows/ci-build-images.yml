name: Build and Push Container Images

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/ci-build-images.yml'
  push:
    branches: 
      - main
      - feat/apps-docker-image
    paths: 
      - 'apps/**'
      - '.github/workflows/ci-build-images.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: apps/api
            image_name: api
          - name: payment-worker
            context: apps/workers/payment
            image_name: payment-worker
          - name: inventory-worker
            context: apps/workers/inventory
            image_name: inventory-worker
          - name: notification-worker
            context: apps/workers/notification
            image_name: notification-worker
          - name: web
            context: apps/web
            image_name: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pulseops-${{ matrix.service.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Update GitOps Image Tags
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4

      - name: Update tags in Helm values
        run: |
          SHORT_SHA="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          VALUES_FILE="charts/pulseops/values.yaml"
          
          yq -i ".api.image.tag = \"${SHORT_SHA}\"" "$VALUES_FILE"
          yq -i ".web.image.tag = \"${SHORT_SHA}\"" "$VALUES_FILE"
          yq -i ".workers.payment.image.tag = \"${SHORT_SHA}\"" "$VALUES_FILE"
          yq -i ".workers.inventory.image.tag = \"${SHORT_SHA}\"" "$VALUES_FILE"
          yq -i ".workers.notification.image.tag = \"${SHORT_SHA}\"" "$VALUES_FILE"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet charts/pulseops/values.yaml; then
            echo "No changes in image tags. Skipping commit."
            exit 0
          fi
          
          git add charts/pulseops/values.yaml
          git commit -m "chore(gitops): bump pulseops image tags to sha-$(echo ${{ github.sha }} | cut -c1-7)"
          git push origin main
