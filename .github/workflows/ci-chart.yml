name: Chart CI Quality Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart-ci.yaml"
  push:
    branches:
      - main
      - feat/charts
    paths:
      - "charts/**"
      - ".github/workflows/chart-ci.yaml"

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-lint:
    name: Helm Lint & Dependency Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Add Helm Repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Build Chart Dependencies
        run: |
          helm dependency build ./charts/pulseops

      - name: Lint Chart
        run: |
          helm lint ./charts/pulseops

  kubeconform:
    name: Manifest Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Add Helm Repositories & Build Dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build ./charts/pulseops

      - name: Install Kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Rendered Manifests
        run: |
          helm template pulseops ./charts/pulseops > /tmp/pulseops-rendered.yaml
          kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/pulseops-rendered.yaml

  trivy-config:
    name: IaC Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "./charts/pulseops"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          skip-dirs: "charts/pulseops/charts"
          hide-progress: true

  chart-testing:
    name: Chart Install Test (KinD)
    runs-on: ubuntu-latest
    needs: [helm-lint, kubeconform]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Chart Testing
        uses: helm/chart-testing-action@v2

      - name: Create KinD Cluster
        uses: helm/kind-action@v1

      - name: Add Helm Repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Run Chart Install Test
        run: |
          ct install --config .github/ct.yaml --charts charts/pulseops