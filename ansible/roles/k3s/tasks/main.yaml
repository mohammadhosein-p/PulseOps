---
- name: Check if K3s binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: "0700"
  when: not k3s_binary.stat.exists

- name: Install K3s server
  ansible.builtin.command:
    cmd: /tmp/k3s_install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version if k3s_version | length > 0 else omit }}"
    INSTALL_K3S_EXEC: >-
      server
      {% if k3s_disable_traefik %}
      --disable=traefik
      {% endif %}
      --write-kubeconfig-mode=644
      --tls-san={{ k3s_api_endpoint }}
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Ensure K3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for K3s Kubernetes API
  ansible.builtin.wait_for:
    host: "{{ k3s_api_endpoint }}"
    port: 6443
    delay: 5
    timeout: 120

- name: Get Kubernetes nodes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: k3s_nodes
  retries: 12
  delay: 5
  until: k3s_nodes.resources | length > 0

- name: Display Kubernetes nodes
  ansible.builtin.debug:
    msg: >-
      K3s cluster is ready.
      Nodes: {{
        k3s_nodes.resources
        | map(attribute='metadata.name')
        | list
      }}
