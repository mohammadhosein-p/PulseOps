apiVersion: v2
name: observability
description: Observability Stack for PulseOps (Metrics & Logs)
type: application
version: 0.2.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: "61.3.1"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled

  - name: eck-stack
    version: "3.5.0"
    repository: "https://helm.elastic.co"
    condition: eck-stack.enabled