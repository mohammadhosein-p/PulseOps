apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: elasticsearch-master-cert
  namespace: {{ .Release.Namespace }}
spec:
  secretName: elasticsearch-master-certs
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: elasticsearch-master
  dnsNames:
    - elasticsearch-master
    - elasticsearch-master.{{ .Release.Namespace }}
    - elasticsearch-master.{{ .Release.Namespace }}.svc
    - elasticsearch-master.{{ .Release.Namespace }}.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1