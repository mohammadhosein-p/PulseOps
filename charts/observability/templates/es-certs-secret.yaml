apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-master-certs
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  ca.crt: ""