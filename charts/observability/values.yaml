kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      retention: 3d
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 512Mi

  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi

  grafana:
    enabled: true
    adminPassword: "admin"
    service:
      type: ClusterIP

  nodeExporter:
    enabled: true

  kubeStateMetrics:
    enabled: true