apiVersion: v2
name: pulseops
description: Enterprise Helm Chart for PulseOps Event-Driven Platform
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: 15.5.20
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled

  - name: redis
    version: 19.6.4
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled

  - name: kafka
    version: 29.3.6
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: kafka.enabled