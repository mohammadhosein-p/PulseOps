apiVersion: v2
name: pulseops
description: Enterprise Helm Chart for PulseOps Event-Driven Platform
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "16.3.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: redis
    version: "20.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  - name: kafka
    version: "29.3.6"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled