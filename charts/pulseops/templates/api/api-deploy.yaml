apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: pulseops-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: pulseops-api
  template:
    metadata:
      labels:
        app: pulseops-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w 2 {{ .Release.Name }}-postgresql 5432; do echo waiting for db; sleep 2; done;']

      containers:
        
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 4000
        
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis-master:6379"
            - name: KAFKA_BROKER
              value: "{{ .Release.Name }}-kafka:9092"
            - name: RATE_LIMIT_MAX_ORDERS
              value: {{ .Values.api.env.RATE_LIMIT_MAX_ORDERS | default 5 | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}