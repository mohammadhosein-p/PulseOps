apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: 80
      nodePort: {{ .Values.web.service.nodePort }}
      protocol: TCP
      name: http
  selector:
    app: pulseops-web