groups:
  - name: pulseops-slo-api
    interval: 30s
    rules:
      # API request rate
      - record: pulseops:sli:api_requests:rate5m
        expr: |
          sum(rate(http_request_duration_seconds_count[5m]))

      # API successful requests
      - record: pulseops:sli:api_requests:good_rate5m
        expr: |
          sum(
            rate(http_request_duration_seconds_count{status_code!~"5.."}[5m])
          )

      # API failed requests
      - record: pulseops:sli:api_requests:bad_rate5m
        expr: |
          sum(
            rate(http_request_duration_seconds_count{status_code=~"5.."}[5m])
          )

      # API availability
      - record: pulseops:sli:api_availability:ratio5m
        expr: |
          1 -
          (
            pulseops:sli:api_requests:bad_rate5m
            /
            pulseops:sli:api_requests:rate5m
          )

      # API p95 latency
      - record: pulseops:sli:api_latency:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          )

      # API availability error ratio
      - record: pulseops:slo:api_availability:error_ratio5m
        expr: |
          1 - pulseops:sli:api_availability:ratio5m

      # API availability error budget remaining
      - record: pulseops:slo:api_availability:error_budget_remaining
        expr: |
          1 -
          (
            pulseops:slo:api_availability:error_ratio5m
            / 0.005
          )


  - name: pulseops-slo-workers
    interval: 30s
    rules:

      # Worker processed events
      - record: pulseops:sli:worker_events:rate5m
        expr: |
          sum(
            rate(pulseops_worker_processed_events_total[5m])
          )

      # Worker successfully processed events
      - record: pulseops:sli:worker_events:success_rate5m
        expr: |
          sum(
            rate(
              pulseops_worker_processed_events_total{
                status="success"
              }[5m]
            )
          )

      # Worker failed events
      - record: pulseops:sli:worker_events:error_rate5m
        expr: |
          sum(
            rate(
              pulseops_worker_processed_events_total{
                status!="success"
              }[5m]
            )
          )

      # Worker processing success ratio
      - record: pulseops:sli:worker_processing:success_ratio5m
        expr: |
          pulseops:sli:worker_events:success_rate5m
          /
          pulseops:sli:worker_events:rate5m

      # Worker error ratio
      - record: pulseops:slo:worker_processing:error_ratio5m
        expr: |
          1 - pulseops:sli:worker_processing:success_ratio5m

      # Worker error budget remaining
      - record: pulseops:slo:worker_processing:error_budget_remaining
        expr: |
          1 -
          (
            pulseops:slo:worker_processing:error_ratio5m
            / 0.005
          )


  - name: pulseops-slo-burn-rate
    interval: 30s
    rules:

      # API availability burn rate
      - record: pulseops:slo:api_availability:burn_rate5m
        expr: |
          (
            1 - pulseops:sli:api_availability:ratio5m
          )
          / 0.005

      # Worker processing burn rate
      - record: pulseops:slo:worker_processing:burn_rate5m
        expr: |
          (
            1 - pulseops:sli:worker_processing:success_ratio5m
          )
          / 0.005